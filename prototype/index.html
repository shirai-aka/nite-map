<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>〇〇にて — あとがきの地図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif; }
  #list, #detail { display: none; }

  /* 地図は見慣れたままにする。色を落とすと地形も道も判別できなくなり、
     静かというより平坦になるため、フィルタはかけない */

  /* 左が地図、右が読み物。吹き出しのように位置が動く器をやめたので、
     題字・画面端・ピンと場所を奪い合うことがなくなる */
  #map {
    position: absolute; top: 0; left: 0; right: var(--panel-w); bottom: 0;
    background: #eceae4;
  }
  #panel {
    --panel-w: 400px;
    position: absolute; top: 0; right: 0; bottom: 0; width: var(--panel-w);
    box-sizing: border-box; padding: 30px 32px 44px;
    background: #fbf9f5; border-left: 1px solid #e3ddd2;
    color: #3a352e; overflow-y: auto;
  }
  :root { --panel-w: 400px; }

  .site-title { color: #3a352e; }
  .site-title h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .12em; }
  .site-title p  { margin: 6px 0 0 2px; font-size: 12px; letter-spacing: .3em; color: #7a7263; }
  #panel .site-title {
    margin-bottom: 26px; padding-bottom: 22px; border-bottom: 1px solid #e3ddd2;
  }

  /* 何も選んでいないときの案内。ここがこのメディアの説明を兼ねる */
  #panel .lead { font-size: 13px; line-height: 2.1; color: #5c554a; margin: 0 0 24px; }
  #panel .stats { font-size: 11.5px; letter-spacing: .14em; color: #7a7263; line-height: 2.2; margin: 0; }

  /* 引用が主役。書名や著者はひとまわり小さく沈める */
  #panel .quote { font-size: 19px; line-height: 2.05; margin: 0 0 22px; }
  #panel .cover { width: 64px; }
  #panel .entry + .entry { margin-top: 32px; padding-top: 32px; }

  /* ピンは栞。下端の切り込みがその地点を指す。
     塗りは color で決め、選択中だけ朱に変える */
  .pin {
    width: 100%; height: 100%;
    color: #7a5a3c;
    transition: color .15s;
    filter: drop-shadow(0 1px 2px rgba(58,53,46,.35));
  }
  .pin svg { display: block; width: 100%; height: 100%; }
  .pin:hover { color: #5d4429; }
  .pin.active { color: #b0522e; }

  .entry + .entry { border-top: 1px solid #e3ddd2; margin-top: 16px; padding-top: 16px; }
  .quote {
    font-size: 15px; margin: 0 0 10px;
    letter-spacing: .04em;
  }
  .bib-row { display: flex; gap: 12px; align-items: flex-start; }
  .cover {
    width: 42px; flex: none;
    box-shadow: 0 1px 4px rgba(58,53,46,.35);
  }
  /* 書影が手に入らない本のための代替。書名を縦組みにした素の表紙に見立てる */
  .cover-none {
    aspect-ratio: 1 / 1.42; box-sizing: border-box;
    background: #f2ede2; border: 1px solid #ddd5c6;
    box-shadow: 0 1px 4px rgba(58,53,46,.18);
    padding: 5px 4px; overflow: hidden;
    display: flex; justify-content: flex-start;
  }
  .cover-none span {
    writing-mode: vertical-rl;
    font-size: 8px; line-height: 1.4; letter-spacing: .04em;
    color: #8d8676; max-height: 100%; overflow: hidden;
  }
  #panel .cover-none span { font-size: 9px; }
  .bib { font-size: 11.5px; color: #7a7263; margin: 0; letter-spacing: .05em; }
  .bib .title { color: #3a352e; }
  .bib a.buy { color: #7a7263; text-decoration: underline; text-underline-offset: 3px; }
  .bib a.buy:hover { color: #3a352e; }
  .bib .sep { color: #c6bdae; margin: 0 .5em; }
  .place-head {
    font-size: 12px; letter-spacing: .25em; color: #7a7263;
    margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid #e3ddd2;
  }

  /* 「地図の外」コーナー */
  .offmap-link {
    position: absolute; bottom: 24px; left: 28px; z-index: 1000;
    font-size: 13px; letter-spacing: .25em; color: #3a352e;
    background: #fbf9f5; padding: 9px 16px 9px 18px; border-radius: 2px;
    box-shadow: 0 1px 6px rgba(58,53,46,.25);
    cursor: pointer; user-select: none; display: none;
  }
  .offmap-link:hover { background: #f4f0e8; }
  .offmap-group + .offmap-group { margin-top: 28px; }

  /* スマホは「地図の帯 + 引用の一覧」の縦組みにする。
     横長の世界地図を縦長の画面に収めると上下に大きな余白が出るため、
     そこをメディアの主役である引用そのものに充てる */
  @media (max-width: 600px) {
    html, body { height: auto; }
    body { background: #eceae4; }

    /* 右の読み物パネルは使わない。題字だけを見出しとして残す */
    #panel {
      position: static; width: auto; padding: 0;
      background: transparent; border-left: none; overflow: visible;
    }
    #panel-body { display: none; }
    #panel .site-title {
      padding: 20px 20px 14px; margin: 0; border-bottom: none;
    }
    .site-title h1 { font-size: 20px; }
    .site-title p  { font-size: 10px; margin-top: 4px; }

    /* 高さは世界の縦横比から JS が px で入れる */
    #map { position: static; right: auto; height: 0; }

    /* 栞をタップしたときは、その場所の本だけを地図のすぐ下に出す。
       一覧まで目を移さずに済むよう、一覧はいったん引っ込める */
    #detail { padding: 18px 20px 30px; }
    body.place-selected #detail { display: block; }
    body.place-selected #list { display: none; }
    #detail .place-head {
      font-size: 12px; letter-spacing: .25em; color: #7a7263;
      margin: 0 0 18px; padding-bottom: 0; border-bottom: none;
    }
    #detail .quote { font-size: 16px; line-height: 2; }
    #detail .entry + .entry {
      border-top: 1px solid #e3ddd2; margin-top: 24px; padding-top: 24px;
    }

    #list { display: block; padding: 4px 20px 40px; }
    #list .item {
      padding: 20px 0; border-top: 1px solid #e3ddd2;
      cursor: pointer;
    }
    #list .item:first-child { border-top: none; }
    #list .item.active { background: #f4f0e8; }
    #list .item .quote { font-size: 15px; }
    #list .offmap-head {
      margin: 28px 0 0; padding-top: 20px;
      border-top: 1px solid #cfc7b8;
      font-size: 12px; letter-spacing: .25em; color: #7a7263;
    }
    #list .offmap-head + .item { border-top: none; }

    /* 一覧に統合するのでフローティングの「地図の外」は使わない */
    .offmap-link { display: none !important; }

    /* 拡大中だけ出す「全体を見る」 */
    .world-link {
      background: #fbf9f5; color: #3a352e;
      font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
      font-size: 11px; letter-spacing: .15em;
      padding: 7px 12px; border-radius: 2px;
      box-shadow: 0 1px 6px rgba(58,53,46,.3);
      cursor: pointer; user-select: none;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    body.zoomed .world-link { opacity: 1; pointer-events: auto; }
  }
</style>
</head>
<body>
<aside id="panel">
  <div class="site-title">
    <h1>〇〇にて</h1>
    <p>あとがきの地図</p>
  </div>
  <div id="panel-body"></div>
</aside>
<div id="map"></div>
<section id="detail"></section>
<section id="list"></section>
<div class="offmap-link" id="offmap-link">地図の外</div>

<script src="config.js"></script>
<script>
const MOBILE = window.matchMedia("(max-width: 600px)");

// 表示用: 引用から署名(氏名)を省く。データ上の quote は原文ママのまま
function displayQuote(rec) {
  const signer = rec.atogaki.signer || rec.translator || rec.author;
  const q = rec.atogaki.quote;
  if (q === signer) return q;
  // 署名を外すと行頭にダッシュや読点が残ることがあるので落とす
  return q.replace(signer, "").replace(/\s+/g, " ").trim()
          .replace(/^[―—–\-・、,\s]+/, "").trim();
}

// 日本を中央に置く。Googleの地図は世界が横に繰り返すので、中心の経度を
// 東経138度にするだけで、左にユーラシア・アフリカ、右にアメリカが並ぶ
const CENTER_LNG = 138;
const WORLD_NORTH = 82, WORLD_SOUTH = -60;
const TILE = 256;

let map;

// メルカトルの正規化y座標(0が北端、1が南端)
function mercY(lat) {
  const s = Math.sin(lat * Math.PI / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
}
function mercLat(y) {
  const n = Math.PI * (1 - 2 * y);
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}

// 表示したい世界(南緯60度〜北緯82度)の高さと中心緯度
const WORLD_H = mercY(WORLD_SOUTH) - mercY(WORLD_NORTH);
const WORLD_CENTER_LAT = mercLat((mercY(WORLD_SOUTH) + mercY(WORLD_NORTH)) / 2);

// この幅と高さに世界が収まるズーム
function worldZoom(w, h) {
  return Math.min(Math.log2(w / TILE), Math.log2(h / (TILE * WORLD_H)));
}

// 表紙画像: openBD から ISBN でまとめて取得(取れなければ表紙なしで表示)
async function fetchCovers(isbns) {
  try {
    const res = await fetch("https://api.openbd.jp/v1/get?isbn=" + isbns.join(","));
    const data = await res.json();
    const covers = {};
    for (const item of data) {
      if (item && item.summary && item.summary.cover) covers[item.summary.isbn] = item.summary.cover;
    }
    return covers;
  } catch (e) {
    return {};
  }
}

// 栞の形。紙色の縁取りで、色の濃い地図の上でも輪郭が残るようにする。
// 下端の切り込みが地点を指すので、要素の下端が座標に合うよう配置する
function shioriElement(count) {
  const w = Math.min(15 + (count - 1) * 4, 26);
  const el = document.createElement("div");
  el.className = "pin";
  el.style.width = w + "px";
  el.style.height = Math.round(w * 1.5) + "px";
  el.innerHTML = `<svg viewBox="0 0 12 18">
    <path d="M1.2 1.2 h9.6 v13.2 l-4.8 -3.3 l-4.8 3.3 z"
          fill="currentColor" stroke="#fbf9f5" stroke-width="1.3" stroke-linejoin="round"/>
  </svg>`;
  return el;
}

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

// 書影のURLはあるのに読み込めなかったときも、代替の表紙に置き換える
function coverFallback(img) {
  const div = document.createElement("div");
  div.className = "cover cover-none";
  const span = document.createElement("span");
  span.textContent = img.dataset.title || "";
  div.appendChild(span);
  img.replaceWith(div);
}

function entryHtml(b, covers) {
  const isbn = b.book && b.book.isbn;
  // 表紙は楽天(ビルド時に取得)を優先し、無ければ openBD
  const cover = b.cover || covers[isbn] || "";
  const links = b.links || {};
  const buy = [
    links.rakuten_url ? `<a class="buy" href="${links.rakuten_url}" target="_blank" rel="noopener">楽天ブックス</a>` : "",
    links.amazon_url ? `<a class="buy" href="${links.amazon_url}" target="_blank" rel="noopener">Amazon</a>` : ""
  ].filter(Boolean).join("<span class=\"sep\">/</span>");
  // 書影がなければ、書名を縦に置いた素の表紙で埋める(欠けたまま並ぶと不揃いになる)
  const blank = `<div class="cover cover-none"><span>${esc(b.title)}</span></div>`;
  return `<div class="entry">
     <p class="quote">${displayQuote(b)}</p>
     <div class="bib-row">
       ${cover
         ? `<img class="cover" src="${esc(cover)}" data-title="${esc(b.title)}" alt="" onerror="coverFallback(this)">`
         : blank}
       <p class="bib"><span class="title">『${b.title}』</span><br>${b.author}${b.translator ? "(訳: " + b.translator + ")" : ""}${buy ? `<br>${buy}` : ""}</p>
     </div>
   </div>`;
}

// --- 右の読み物パネル(デスクトップ) ---

const panelBody = () => document.getElementById("panel-body");

function setPanel(html) {
  panelBody().innerHTML = html;
  document.getElementById("panel").scrollTop = 0;
}

// 何も選んでいないとき。ここがこのメディアの説明と規模を兼ねる
function showIntro(stats) {
  setPanel(
    `<p class="lead">本のあとがきに書かれた「〇〇にて」を集めています。<br>
      地図の点をたどると、その本が書かれた場所に行き当たります。</p>
     <p class="stats">${stats.quotes}の引用<br>${stats.places}の場所<br>${stats.from}年 — ${stats.to}年</p>`
  );
}

function showPlace(name, list, covers) {
  setPanel(`<p class="place-head">${name}</p>` + list.map(b => entryHtml(b, covers)).join(""));
}

// 「地図の外」: precision: unmappable(機上にて等)を kind ごとにまとめて出す
// (デスクトップのみ。スマホでは引用一覧の末尾に統合する)
function showOffmap(offmap, covers) {
  const kinds = {};
  for (const b of offmap) {
    const k = (b.place && b.place.kind) || "そのほか";
    (kinds[k] ||= []).push(b);
  }
  setPanel(
    `<p class="place-head">地図の外</p>` +
    `<p class="lead">地図に置けない場所で書かれた本。</p>` +
    Object.keys(kinds).map(k =>
      `<div class="offmap-group">
         <p class="place-head">${k}</p>
         ${kinds[k].map(b => entryHtml(b, covers)).join("")}
       </div>`
    ).join("")
  );
}

async function init() {
  // no-cache: 毎回サーバーに問い合わせる(更新が反映されない事故を防ぐ。
  // 中身が変わっていなければ 304 が返るので転送量は増えない)
  const books = await fetch("books.json", { cache: "no-cache" }).then(r => r.json());
  const mappable = books.filter(b => b.place && b.place.lat != null && b.place.lng != null);
  const offmap = books.filter(b => b.place && b.place.precision === "unmappable");
  const covers = await fetchCovers(
    books.map(b => b.book && b.book.isbn).filter(Boolean)
  );

  // 地図を作る。スマホの帯は先に高さを決めておく
  // (高さ0のまま生成すると、あとから高さを入れてもズームが切り上げられる)
  const mapEl = document.getElementById("map");
  const applyBandHeight = () => {
    if (MOBILE.matches) mapEl.style.height = Math.round(mapEl.clientWidth * WORLD_H) + "px";
  };
  applyBandHeight();
  const z0 = worldZoom(mapEl.clientWidth || 800, mapEl.clientHeight || 600);
  map = new google.maps.Map(mapEl, {
    mapId: (window.NITE_CONFIG || {}).googleMapsMapId,
    center: { lat: WORLD_CENTER_LAT, lng: CENTER_LNG },
    zoom: z0,
    minZoom: z0,
    maxZoom: 18,
    // 縦方向は世界の外(極地の白)へ行かないよう止める。横は回り込ませる。
    // 表示したい範囲と同じにすると境界でズームが切り上げられるので少し広く取る
    restriction: {
      latLngBounds: { north: WORLD_NORTH + 4, south: WORLD_SOUTH - 4, west: -180, east: 180 },
      strictBounds: false
    },
    // 地図そのものを見せたいので、余計な操作系は置かない
    mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
    cameraControl: false,
    zoomControl: !MOBILE.matches,
    zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_BOTTOM },
    clickableIcons: false,
    keyboardShortcuts: false
  });

  const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

  // 同一座標の本をまとめる
  const groups = {};
  for (const b of mappable) {
    const key = b.place.lat + "," + b.place.lng;
    (groups[key] ||= []).push(b);
  }

  const markers = {};
  const precisions = {};
  for (const key in groups) {
    const g = groups[key];
    const [lat, lng] = key.split(",").map(Number);
    precisions[key] = g[0].place.precision;

    const content = shioriElement(g.length);
    const marker = new AdvancedMarkerElement({
      map, position: { lat, lng }, content, gmpClickable: true,
      title: g[0].place.name
    });
    markers[key] = marker;

    // 新しいマーカーは gmp-click。click は非推奨警告が出る
    marker.addListener("gmp-click", () => {
      selectPin(key);
      if (MOBILE.matches) openPlace(key, g);
      else showPlace(g[0].place.name, g, covers);
    });
  }

  function pinEl(key) {
    const m = markers[key];
    return m && m.content ? m.content.querySelector ? m.content : null : null;
  }

  function selectPin(key) {
    document.querySelectorAll(".pin.active").forEach(p => p.classList.remove("active"));
    const el = key && pinEl(key);
    if (el) el.classList.add("active");
  }

  // --- スマホ: 栞をタップしたら、寄って、その本を地図のすぐ下に出す ---

  function openPlace(key, g) {
    const [lat, lng] = key.split(",").map(Number);
    map.setZoom(zoomFor(precisions[key]));
    map.panTo({ lat, lng });
    document.getElementById("detail").innerHTML =
      `<p class="place-head">${g[0].place.name}</p>` +
      g.map(b => entryHtml(b, covers)).join("");
    document.body.classList.add("place-selected");
    window.scrollTo(0, 0);
  }

  function closePlace() {
    document.body.classList.remove("place-selected");
    document.getElementById("detail").innerHTML = "";
    selectPin(null);
  }

  // --- 世界全体の見せ方 ---

  // 世界がちょうど収まるズーム。Googleの地図に getMinZoom() は無いので控えておく
  let worldZ = worldZoom(mapEl.clientWidth || 800, mapEl.clientHeight || 600);

  // 世界がちょうど収まる位置に戻す
  function showWorld() {
    worldZ = worldZoom(mapEl.clientWidth, mapEl.clientHeight);
    map.setOptions({ minZoom: worldZ });
    map.setCenter({ lat: WORLD_CENTER_LAT, lng: CENTER_LNG });
    map.setZoom(worldZ);
    if (MOBILE.matches) closePlace();
  }

  // スマホの地図帯は、世界の縦横比ぴったりの高さにして上下の余白をなくす
  function layoutMobileMap() {
    applyBandHeight();
    showWorld();
  }

  // 寄る深さは場所の精度に合わせる。「シリコンバレー」で街路まで寄っても
  // 意味がないし、「目黒区東山」を国単位で見ても仕方がない
  function zoomFor(precision) {
    return { exact: 14, neighborhood: 13, city: 12, region: 9, country: 5 }[precision] || 12;
  }

  // 拡大したあと世界に戻るための導線(スマホのみ)
  function addWorldControl() {
    const el = document.createElement("div");
    el.className = "world-link";
    el.textContent = "全体を見る";
    el.addEventListener("click", showWorld);
    map.controls[google.maps.ControlPosition.RIGHT_BOTTOM].push(el);
    map.addListener("zoom_changed", () =>
      document.body.classList.toggle("zoomed", map.getZoom() > worldZ + 0.3));
  }

  function renderList() {
    const list = document.getElementById("list");
    const key = b => b.place.lat + "," + b.place.lng;
    const byDate = (a, b) => (b.atogaki.date || "").localeCompare(a.atogaki.date || "");
    const item = (b, k) =>
      `<div class="item"${k ? ` data-key="${k}"` : ""}>${entryHtml(b, covers)}</div>`;

    list.innerHTML =
      mappable.slice().sort(byDate).map(b => item(b, key(b))).join("") +
      (offmap.length
        ? `<p class="offmap-head">地図の外</p>` +
          offmap.slice().sort(byDate).map(b => item(b, null)).join("")
        : "");

    list.addEventListener("click", e => {
      const el = e.target.closest(".item");
      if (!el || e.target.closest("a")) return; // Amazonリンクは素通し
      const k = el.dataset.key;
      if (!k) return; // 「地図の外」は飛び先がない
      const [lat, lng] = k.split(",").map(Number);
      window.scrollTo(0, 0);
      map.setZoom(zoomFor(precisions[k]));
      map.panTo({ lat, lng });
      highlightPin(k);
    });
  }

  function highlightPin(k) {
    selectPin(k);
    const el = pinEl(k);
    if (el) setTimeout(() => el.classList.remove("active"), 2400);
  }

  function layout() {
    if (MOBILE.matches) layoutMobileMap();
    else showWorld();
  }

  if (MOBILE.matches) {
    renderList();
    addWorldControl();
  } else {
    const years = books.map(b => b.atogaki.date).filter(Boolean)
                       .map(d => Number(String(d).slice(0, 4)));
    const stats = {
      quotes: books.length,
      places: Object.keys(groups).length,
      from: Math.min(...years), to: Math.max(...years)
    };
    showIntro(stats);
    // 地図の余白を押したら選択を解いて案内に戻す
    map.addListener("click", () => { selectPin(null); showIntro(stats); });

    const link = document.getElementById("offmap-link");
    if (offmap.length) {
      link.style.display = "block";
      link.addEventListener("click", () => { selectPin(null); showOffmap(offmap, covers); });
    }
  }

  layout();
  // 生成直後の指定は、地図の準備が整う過程で上書きされてしまう。
  // 初回の描画が終わってからもう一度合わせる。ただし利用者が先に
  // 触っていた場合は勝手に戻さない
  let touched = false;
  map.addListener("dragstart", () => { touched = true; });
  map.addListener("click", () => { touched = true; });
  google.maps.event.addListenerOnce(map, "tilesloaded", () => {
    if (!touched) layout();
  });
  window.addEventListener("resize", layout);
  // 600px の境界をまたいだらレイアウト方式ごと切り替える
  MOBILE.addEventListener("change", () => window.location.reload());
}

// Google Maps を読み込んでから init を呼ぶ。キーは config.js 経由で渡る
(function loadMap() {
  const cfg = window.NITE_CONFIG || {};
  if (!cfg.googleMapsKey) {
    document.getElementById("panel-body").innerHTML =
      `<p class="lead">地図のキーが設定されていません。<br>
        <code>.env</code> に GOOGLE_MAPS_KEY を入れて
        <code>node --env-file=.env build.js</code> を実行してください。</p>`;
    return;
  }
  window.initMap = init;
  // キーの制限や課金設定に問題があると Google がこれを呼ぶ。
  // 地図が白いままだと原因が分からないので、パネルに理由を出す
  window.gm_authFailure = () => {
    document.getElementById("panel-body").innerHTML =
      `<p class="lead">地図を読み込めませんでした。<br>
        APIキーの「ウェブサイトの制限」に、いま開いているURL
        (<code>${location.origin}</code>)が入っているかを確認してください。<br>
        請求先アカウントが有効か、1日の割り当てを超えていないかも確認先です。</p>`;
  };
  const s = document.createElement("script");
  s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(cfg.googleMapsKey) +
          "&v=weekly&language=ja&region=JP&loading=async&callback=initMap";
  s.async = true;
  document.head.appendChild(s);
})();
</script>
