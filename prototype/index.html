<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>〇〇にて — あとがきの地図</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif; }
  #map { height: 100%; background: #eceae4; }
  #list { display: none; }

  /* 実用の地図の色を、古い紙に刷られた地図の色に寄せる */
  .leaflet-tile-pane { filter: sepia(.35) saturate(.35) brightness(1.05) contrast(.95); }
  /* 引いた状態では海の波模様と地名が密集して騒がしいので、さらに淡くする */
  body.far .leaflet-tile-pane { filter: sepia(.35) saturate(.28) brightness(1.09) contrast(.88); }

  .site-title {
    position: absolute; top: 24px; left: 28px; z-index: 1000;
    pointer-events: none; color: #3a352e;
  }
  .site-title h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .12em; }
  .site-title p  { margin: 6px 0 0 2px; font-size: 12px; letter-spacing: .3em; color: #7a7263; }

  .pin {
    border-radius: 50%;
    background: #3a352e; border: 2px solid #f4f1ec;
    box-shadow: 0 0 0 1px #3a352e;
    width: 100%; height: 100%;
  }

  .leaflet-popup-content-wrapper {
    background: #fbf9f5; color: #3a352e;
    border-radius: 2px; box-shadow: 0 2px 14px rgba(58,53,46,.25);
  }
  .leaflet-popup-tip { background: #fbf9f5; }
  .leaflet-popup-content { margin: 20px 22px; line-height: 1.9; }

  .entry + .entry { border-top: 1px solid #e3ddd2; margin-top: 16px; padding-top: 16px; }
  .quote {
    font-size: 15px; margin: 0 0 10px;
    letter-spacing: .04em;
  }
  .bib-row { display: flex; gap: 12px; align-items: flex-start; }
  .cover {
    width: 42px; flex: none;
    box-shadow: 0 1px 4px rgba(58,53,46,.35);
  }
  .bib { font-size: 11.5px; color: #7a7263; margin: 0; letter-spacing: .05em; }
  .bib .title { color: #3a352e; }
  .bib a.buy { color: #7a7263; text-decoration: underline; text-underline-offset: 3px; }
  .bib a.buy:hover { color: #3a352e; }
  .place-head {
    font-size: 12px; letter-spacing: .25em; color: #7a7263;
    margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid #e3ddd2;
  }

  /* 「地図の外」コーナー */
  .offmap-link {
    position: absolute; bottom: 24px; left: 28px; z-index: 1000;
    font-size: 13px; letter-spacing: .25em; color: #3a352e;
    background: #fbf9f5; padding: 9px 16px 9px 18px; border-radius: 2px;
    box-shadow: 0 1px 6px rgba(58,53,46,.25);
    cursor: pointer; user-select: none; display: none;
  }
  .offmap-link:hover { background: #f4f0e8; }
  .offmap-panel {
    position: absolute; bottom: 68px; left: 28px; z-index: 1000;
    width: 300px; max-height: 62vh; overflow-y: auto;
    background: #fbf9f5; color: #3a352e; border-radius: 2px;
    box-shadow: 0 2px 14px rgba(58,53,46,.25);
    padding: 20px 22px; line-height: 1.9; display: none;
  }
  .offmap-panel .lead {
    font-size: 11px; color: #7a7263; letter-spacing: .1em;
    margin: 0 0 16px;
  }
  .offmap-group + .offmap-group { margin-top: 20px; }

  /* パネルを開いている間はズーム操作を隠す(狭い画面で重なるため) */
  body.offmap-open .leaflet-control-zoom { display: none; }

  /* スマホは「地図の帯 + 引用の一覧」の縦組みにする。
     横長の世界地図を縦長の画面に収めると上下に大きな余白が出るため、
     そこをメディアの主役である引用そのものに充てる */
  @media (max-width: 600px) {
    html, body { height: auto; }
    body { background: #eceae4; }

    .site-title {
      position: static; padding: 20px 20px 14px;
    }
    .site-title h1 { font-size: 20px; }
    .site-title p  { font-size: 10px; margin-top: 4px; }

    /* 高さは世界の縦横比から JS が px で入れる */
    #map { height: 0; }

    #list { display: block; padding: 4px 20px 40px; }
    #list .item {
      padding: 20px 0; border-top: 1px solid #e3ddd2;
      cursor: pointer;
    }
    #list .item:first-child { border-top: none; }
    #list .item.active { background: #f4f0e8; }
    #list .item .quote { font-size: 15px; }
    #list .offmap-head {
      margin: 28px 0 0; padding-top: 20px;
      border-top: 1px solid #cfc7b8;
      font-size: 12px; letter-spacing: .25em; color: #7a7263;
    }
    #list .offmap-head + .item { border-top: none; }

    .pin.active { background: #8a6a3b; box-shadow: 0 0 0 1px #8a6a3b, 0 0 0 6px rgba(138,106,59,.22); }

    /* 一覧に統合するのでフローティングの「地図の外」は使わない */
    .offmap-link, .offmap-panel { display: none !important; }

    /* 狭い帯では邪魔になる。拡大縮小はピンチで足りる */
    .leaflet-control-zoom { display: none; }
    .leaflet-control-attribution { font-size: 9px; }
  }
</style>
</head>
<body>
<div class="site-title">
  <h1>〇〇にて</h1>
  <p>あとがきの地図</p>
</div>
<div id="map"></div>
<section id="list"></section>
<div class="offmap-link" id="offmap-link">地図の外</div>
<div class="offmap-panel" id="offmap-panel"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 表示用: 引用から署名(氏名)を省く。データ上の quote は原文ママのまま
function displayQuote(rec) {
  const signer = rec.atogaki.signer || rec.translator || rec.author;
  const q = rec.atogaki.quote;
  return q === signer ? q : q.replace(signer, "").replace(/\s+/g, " ").trim();
}

// 日本を中央に置く。経度の基準を東経138度にずらすと、左にユーラシア・
// アフリカ、右に南北アメリカが並ぶ太平洋中心の配置になる
const CENTER_LNG = 138;
const WEST = CENTER_LNG - 180, EAST = CENTER_LNG + 180;
const WORLD = L.latLngBounds([[-60, WEST], [82, EAST]]);

// 経度を [WEST, EAST) に畳み込む。西経のアメリカは +360 されて右側に出る
function normLng(lng) {
  return ((lng - WEST) % 360 + 360) % 360 + WEST;
}

const map = L.map("map", {
  zoomControl: false,
  maxBounds: WORLD,
  maxBoundsViscosity: 1.0,
  // 整数ズームだけだと画面幅に対して地図が小さく収まりすぎる
  zoomSnap: 0.25
});

// 引ける限界は「世界が画面に収まるズーム」。固定値にすると
// 縦長のスマホで世界が収まりきらず、ピンが画面外に出る
function applyMinZoom() {
  const z = map.getBoundsZoom(WORLD, false);
  map.setMinZoom(z);
}
L.control.zoom({ position: "bottomright" }).addTo(map);

// OSM日本(OSMFJ)。地名はその土地の言葉で出る。海外にも街路まで入っているので
// 拡大するほどその場所の生活が見えてくる。色はセピア調フィルタで落とす
L.tileLayer("https://tile.openstreetmap.jp/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> Contributors',
  maxZoom: 18,
  // 日付変更線をまたいで表示するのでタイルを繰り返す
  noWrap: false
}).addTo(map);

// 表紙画像: openBD から ISBN でまとめて取得(取れなければ表紙なしで表示)
async function fetchCovers(isbns) {
  try {
    const res = await fetch("https://api.openbd.jp/v1/get?isbn=" + isbns.join(","));
    const data = await res.json();
    const covers = {};
    for (const item of data) {
      if (item && item.summary && item.summary.cover) covers[item.summary.isbn] = item.summary.cover;
    }
    return covers;
  } catch (e) {
    return {};
  }
}

const MOBILE = window.matchMedia("(max-width: 600px)");

function entryHtml(b, covers) {
  const isbn = b.book && b.book.isbn;
  return `<div class="entry">
     <p class="quote">${displayQuote(b)}</p>
     <div class="bib-row">
       ${covers[isbn] ? `<img class="cover" src="${covers[isbn]}" alt="" onerror="this.remove()">` : ""}
       <p class="bib"><span class="title">『${b.title}』</span><br>${b.author}${b.translator ? "(訳: " + b.translator + ")" : ""}${b.links && b.links.amazon_url ? `<br><a class="buy" href="${b.links.amazon_url}" target="_blank" rel="noopener">Amazonで見る</a>` : ""}</p>
     </div>
   </div>`;
}

// 「地図の外」: precision: unmappable(機上にて等)を kind ごとにまとめて出す
// (デスクトップのみ。スマホでは引用一覧の末尾に統合する)
function renderOffmap(offmap, covers) {
  if (!offmap.length || MOBILE.matches) return;
  const link = document.getElementById("offmap-link");
  const panel = document.getElementById("offmap-panel");

  const kinds = {};
  for (const b of offmap) {
    const k = (b.place && b.place.kind) || "その他";
    (kinds[k] ||= []).push(b);
  }
  panel.innerHTML =
    `<p class="lead">地図に置けない場所で書かれた本。</p>` +
    Object.keys(kinds).map(k =>
      `<div class="offmap-group">
         <p class="place-head">${k}にて</p>
         ${kinds[k].map(b => entryHtml(b, covers)).join("")}
       </div>`
    ).join("");

  link.style.display = "block";
  link.addEventListener("click", () => {
    const open = panel.style.display === "block";
    panel.style.display = open ? "none" : "block";
    document.body.classList.toggle("offmap-open", !open);
  });
}

async function init() {
  const books = await fetch("books.json").then(r => r.json());
  const mappable = books.filter(b => b.place && b.place.lat != null && b.place.lng != null);
  const offmap = books.filter(b => b.place && b.place.precision === "unmappable");
  const covers = await fetchCovers(
    books.map(b => b.book && b.book.isbn).filter(Boolean)
  );
  renderOffmap(offmap, covers);

  // 同一座標の本をまとめる
  const groups = {};
  for (const b of mappable) {
    const key = b.place.lat + "," + normLng(b.place.lng);
    (groups[key] ||= []).push(b);
  }

  const setFar = () => document.body.classList.toggle("far", map.getZoom() < 4);
  map.on("zoomend", setFar);
  setFar();

  const latlngs = [];
  const markers = {};
  for (const key in groups) {
    const g = groups[key];
    const [lat, lng] = key.split(",").map(Number);
    latlngs.push([lat, lng]);

    // 冊数はドットの大きさで表す
    const size = Math.min(12 + (g.length - 1) * 5, 26);
    const icon = L.divIcon({
      className: "",
      html: `<div class="pin"></div>`,
      iconSize: [size, size], iconAnchor: [size / 2, size / 2]
    });

    const marker = L.marker([lat, lng], { icon }).addTo(map);
    markers[key] = marker;

    if (MOBILE.matches) {
      // 狭い帯の中にポップアップを出すと窮屈なので、一覧側へ送る
      marker.on("click", () => focusItem(key));
    } else {
      const html =
        `<p class="place-head">${g[0].place.name}</p>` +
        g.map(b => entryHtml(b, covers)).join("");
      marker.bindPopup(html, {
        maxWidth: Math.min(320, window.innerWidth - 48),
        minWidth: Math.min(260, window.innerWidth - 48),
        autoPanPadding: L.point(20, 80)
      });
    }
  }

  // --- スマホ: 地図の下に引用を積む ---

  // 世界の縦横比。地図帯をこの高さにすると上下に余白が出ない
  function worldRatio() {
    const nw = map.project(WORLD.getNorthWest(), 0);
    const se = map.project(WORLD.getSouthEast(), 0);
    return (se.y - nw.y) / (se.x - nw.x);
  }

  function layoutMobileMap() {
    const el = document.getElementById("map");
    el.style.height = Math.round(el.clientWidth * worldRatio()) + "px";
    map.invalidateSize();
    applyMinZoom();
    map.fitBounds(WORLD, { padding: [0, 0], animate: false });
  }

  function renderList() {
    const list = document.getElementById("list");
    const key = b => b.place.lat + "," + normLng(b.place.lng);
    const byDate = (a, b) => (b.atogaki.date || "").localeCompare(a.atogaki.date || "");
    const item = (b, k) =>
      `<div class="item"${k ? ` data-key="${k}"` : ""}>${entryHtml(b, covers)}</div>`;

    list.innerHTML =
      mappable.slice().sort(byDate).map(b => item(b, key(b))).join("") +
      (offmap.length
        ? `<p class="offmap-head">地図の外</p>` +
          offmap.slice().sort(byDate).map(b => item(b, null)).join("")
        : "");

    list.addEventListener("click", e => {
      const el = e.target.closest(".item");
      if (!el || e.target.closest("a")) return; // Amazonリンクは素通し
      const k = el.dataset.key;
      if (!k) return; // 「地図の外」は飛び先がない
      // 帯には世界全体が入っているので、視点は動かさずピンを光らせるだけでよい
      window.scrollTo(0, 0);
      highlightPin(k);
    });
  }

  function highlightPin(k) {
    document.querySelectorAll(".pin.active").forEach(p => p.classList.remove("active"));
    const el = markers[k] && markers[k].getElement();
    const pin = el && el.querySelector(".pin");
    if (!pin) return;
    pin.classList.add("active");
    setTimeout(() => pin.classList.remove("active"), 2400);
  }

  // ピン → 一覧。その場所の最初の項目までスクロールして目印を付ける
  function focusItem(k) {
    const el = document.querySelector(`#list .item[data-key="${k}"]`);
    if (!el) return;
    document.querySelectorAll("#list .item.active").forEach(i => i.classList.remove("active"));
    el.classList.add("active");
    el.scrollIntoView({ block: "center" });
    setTimeout(() => el.classList.remove("active"), 2400);
  }

  // --- デスクトップ: 画面全面の地図にピン範囲を収める ---

  function fitDesktop() {
    map.invalidateSize();
    applyMinZoom();
    const pad = Math.min(60, Math.round(map.getSize().x * 0.08));
    map.fitBounds(L.latLngBounds(latlngs), { padding: [pad, pad], animate: false });
  }

  function layout() {
    if (MOBILE.matches) layoutMobileMap();
    else fitDesktop();
  }

  if (MOBILE.matches) renderList();

  // コンテナサイズ確定前だと fitBounds が壊れるため、妥当なズームになるまで再試行
  (function ensureFit(tries) {
    layout();
    if (map.getZoom() > 8 && tries > 0) setTimeout(() => ensureFit(tries - 1), 200);
  })(50);

  window.addEventListener("resize", layout);
  // 600px の境界をまたいだらレイアウト方式ごと切り替える
  MOBILE.addEventListener("change", () => window.location.reload());
}

init();
</script>
</body>
</html>
