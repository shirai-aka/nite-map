<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- SNSで共有されたときの見出し画像(1200×630)の原稿。
     design/make-og.sh で prototype/og.png に書き出す -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #fbf9f5; color: #3a352e;
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
  }
  /* 紙の縁取り */
  .frame { position: absolute; inset: 28px; border: 1px solid #e3ddd2; }

  /* 貼り付け先によっては左右が切り落とされる(1200幅のうち中央の約920px しか出ないことがある)ので、
     中身は x 180〜1020 に収める */
  .title { position: absolute; left: 184px; top: 168px; }
  .title h1 { margin: 0; font-size: 84px; font-weight: 700; letter-spacing: .1em; line-height: 1; }
  .title .sub { margin: 26px 0 0 4px; font-size: 25px; letter-spacing: .5em; color: #7a7263; }
  .title .lead {
    margin: 52px 0 0 4px; font-size: 18px; line-height: 1.9; color: #5c554a; letter-spacing: .06em;
  }

  /* 栞を挟んだ一行を縦書きで吊るす */
  .lines { position: absolute; right: 182px; top: 104px; display: flex; gap: 24px; }
  .line { display: flex; flex-direction: column; align-items: center; }
  .line svg { width: 20px; height: 30px; color: #7a5a3c; }
  .line.sel svg { color: #b0522e; }
  .line span {
    writing-mode: vertical-rl; margin-top: 16px;
    font-size: 22px; letter-spacing: .14em; color: #4a443b;
  }
  .line.sel span { color: #3a352e; font-weight: 700; }
</style>
</head>
<body>
  <div class="frame"></div>

  <div class="title">
    <h1>〇〇にて</h1>
    <div class="sub">あとがきの地図</div>
    <div class="lead">本のあとがきの終わりに置かれた<br>「どこで書いたか」の一行を、地図に集めて。</div>
  </div>

  <div class="lines">
    <div class="line" style="margin-top:70px"><svg viewBox="0 0 12 18"><path d="M1.2 1.2 h9.6 v13.2 l-4.8 -3.3 l-4.8 3.3 z" fill="currentColor"/></svg><span>茗荷谷の喫茶店で</span></div>
    <div class="line" style="margin-top:20px"><svg viewBox="0 0 12 18"><path d="M1.2 1.2 h9.6 v13.2 l-4.8 -3.3 l-4.8 3.3 z" fill="currentColor"/></svg><span>ダカールにて</span></div>
    <div class="line sel" style="margin-top:0"><svg viewBox="0 0 12 18"><path d="M1.2 1.2 h9.6 v13.2 l-4.8 -3.3 l-4.8 3.3 z" fill="currentColor"/></svg><span>雪が舞う山中の湖畔にて</span></div>
    <div class="line" style="margin-top:46px"><svg viewBox="0 0 12 18"><path d="M1.2 1.2 h9.6 v13.2 l-4.8 -3.3 l-4.8 3.3 z" fill="currentColor"/></svg><span>城の崎にて</span></div>
    <div class="line" style="margin-top:10px"><svg viewBox="0 0 12 18"><path d="M1.2 1.2 h9.6 v13.2 l-4.8 -3.3 l-4.8 3.3 z" fill="currentColor"/></svg><span>湯島天神の見える書斎にて</span></div>
  </div>
</body>
</html>
