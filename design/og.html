<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- SNSで共有されたときの見出し画像(1200×630)の原稿。
     design/make-og.sh で prototype/og.png に書き出す -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #fbf9f5; color: #3a352e;
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
  }
  /* 紙の縁取り */
  .frame { position: absolute; inset: 28px; border: 1px solid #e3ddd2; }

  /* 貼り付け先によっては左右が切り落とされる(正方形に近く切るところもある)ので、
     題字は中央の正方形(x 285〜915)に収め、栞の行は中央寄りの両脇に置く */
  .title {
    position: absolute; left: 0; right: 0; top: 218px; text-align: center;
  }
  .title h1 { margin: 0; font-size: 92px; font-weight: 700; letter-spacing: .08em; line-height: 1; padding-left: .08em; }
  .title .sub { margin-top: 30px; font-size: 28px; letter-spacing: .5em; padding-left: .5em; color: #7a7263; }

  .lines { position: absolute; top: 118px; display: flex; gap: 30px; }
  .lines.l { left: 196px; }
  .lines.r { right: 196px; }
  .line { display: flex; flex-direction: column; align-items: center; }
  .line svg { width: 20px; height: 30px; color: #7a5a3c; }
  .line.sel svg { color: #b0522e; }
  .line span {
    writing-mode: vertical-rl; margin-top: 14px;
    font-size: 23px; letter-spacing: .14em; color: #4a443b;
  }
  .line.sel span { color: #3a352e; font-weight: 700; }
</style>
</head>
<body>
  <div class="frame"></div>

  <div class="lines l">
    <div class="line" style="margin-top:60px"><svg viewBox="0 0 12 18"><path d="M1.2 1.2 h9.6 v13.2 l-4.8 -3.3 l-4.8 3.3 z" fill="currentColor"/></svg><span>茗荷谷の喫茶店で</span></div>
    <div class="line" style="margin-top:0px"><svg viewBox="0 0 12 18"><path d="M1.2 1.2 h9.6 v13.2 l-4.8 -3.3 l-4.8 3.3 z" fill="currentColor"/></svg><span>ダカールにて</span></div>
  </div>

  <div class="title">
    <h1>〇〇にて</h1>
    <div class="sub">あとがきの地図</div>
  </div>

  <div class="lines r">
    <div class="line sel" style="margin-top:0px"><svg viewBox="0 0 12 18"><path d="M1.2 1.2 h9.6 v13.2 l-4.8 -3.3 l-4.8 3.3 z" fill="currentColor"/></svg><span>雪が舞う山中の湖畔にて</span></div>
    <div class="line" style="margin-top:48px"><svg viewBox="0 0 12 18"><path d="M1.2 1.2 h9.6 v13.2 l-4.8 -3.3 l-4.8 3.3 z" fill="currentColor"/></svg><span>城の崎にて</span></div>
  </div>
</body>
</html>
